name: Upstream Sync & Patched F-Droid Build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream branch or tag to base build on'
        required: true
        default: 'dev'
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 4am UTC
  push:
    paths:
      - 'patches/**'
      - '.github/workflows/upstream-sync-and-build.yml'

jobs:
  build-patched:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RetroDrome
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Upstream Remote
        run: |
          git remote add upstream https://github.com/RetroMusicPlayer/RetroMusicPlayer.git || true
          git fetch upstream

      - name: Apply RetroDrome Patches onto Upstream
        run: |
          UPSTREAM_REF="${{ github.event.inputs.upstream_ref || 'dev' }}"
          echo "Preserving patches in temporary storage..."
          TEMP_PATCH_DIR="$(mktemp -d)"
          cp -r patches/* "${TEMP_PATCH_DIR}/"

          echo "Checking out clean upstream: upstream/${UPSTREAM_REF}"
          git checkout "upstream/${UPSTREAM_REF}"
          
          echo "Validating and applying patches..."
          for patch in "${TEMP_PATCH_DIR}"/*.patch; do
            echo "Applying $(basename "$patch")..."
            git apply "$patch"
          done
          rm -rf "${TEMP_PATCH_DIR}"

      - name: Build Degoogled F-Droid Release APK
        run: ./gradlew :app:assembleFdroidRelease

      - name: Upload F-Droid APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrodrome-fdroid-release-apk
          path: app/build/outputs/apk/fdroid/release/*.apk
